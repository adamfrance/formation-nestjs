services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhub
      POSTGRES_DB: learnhub
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnhub']
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - '8080:3000'
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: learnhub
      DB_PASSWORD: learnhub
      DB_NAME: learnhub
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees:
